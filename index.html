<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #4b176d, #160020 70%);
    font-family: Arial, sans-serif;
}

/* Birthday Card */
.birthday-card {
    position: relative;
    z-index: 10;
    width: 340px;
    padding: 30px 20px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 30px #c45cff;
}

/* Heading */
.birthday-card h1 {
    color: white;
    font-size: 30px;
    margin-bottom: 25px;
    animation: titleGlow 2s infinite alternate;
}

@keyframes titleGlow {
    from {
        text-shadow: 0 0 8px #ff69d4;
    }

    to {
        text-shadow:
        0 0 10px #ff69d4,
        0 0 25px #c45cff,
        0 0 45px #ff9bea;
    }
}

/* Animated Photo */
.photo-container {
    width: 220px;
    height: 220px;
    margin: auto;
    padding: 7px;
    border-radius: 50%;
    background: linear-gradient(
        45deg,
        #ff4ecd,
        #8b5cff,
        #ffb3f7,
        #7b2cff
    );
    background-size: 400% 400%;
    animation: gradientMove 4s ease infinite,
               photoRotate 8s linear infinite;
    box-shadow:
        0 0 20px #ff4ecd,
        0 0 45px #a13cff,
        0 0 80px rgba(216,108,255,0.8);
}

.photo-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #21002d;
    animation: photoZoom 3s ease-in-out infinite;
}

@keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes photoRotate {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

@keyframes photoZoom {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

/* Birthday Message */
.message {
    color: #ffe4ff;
    margin-top: 25px;
    font-size: 17px;
    line-height: 1.5;
}

/* Floating Hearts */
.heart {
    position: fixed;
    bottom: -50px;
    font-size: 25px;
    animation: floatHeart 7s linear infinite;
    z-index: 5;
}

.heart:nth-child(1) {
    left: 10%;
    animation-delay: 0s;
}

.heart:nth-child(2) {
    left: 25%;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 45%;
    animation-delay: 4s;
}

.heart:nth-child(4) {
    left: 70%;
    animation-delay: 1s;
}

.heart:nth-child(5) {
    left: 90%;
    animation-delay: 3s;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) scale(0.5) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform:
        translateY(-110vh)
        scale(1.4)
        rotate(30deg);
        opacity: 0;
    }
}

/* Glowing Particles */
.particle {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 15px #ff8eea;
    animation: particleMove 5s ease-in-out infinite;
}

.p1 {
    top: 15%;
    left: 15%;
}

.p2 {
    top: 30%;
    left: 85%;
    animation-delay: 1s;
}

.p3 {
    top: 75%;
    left: 20%;
    animation-delay: 2s;
}

.p4 {
    top: 80%;
    left: 80%;
    animation-delay: 3s;
}

.p5 {
    top: 10%;
    left: 50%;
    animation-delay: 4s;
}

@keyframes particleMove {
    0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.3;
    }

    50% {
        transform: translateY(-40px) scale(2);
        opacity: 1;
    }
}
</style>
</head>

<body>

<!-- 🎂 Birthday Card -->
<div class="birthday-card">

    <h1>🎂 Happy Birthday ❤️</h1>

    <!-- 📸 YOUR PHOTO -->
    <div class="photo-container">
        <img src="photo.jpg" alt="Birthday Photo">
    </div>

    <p class="message">
        ✨ Wishing you endless happiness,<br>
        beautiful memories & lots of love! 💜
    </p>

</div>

<!-- ❤️ Floating Hearts -->
<div class="heart">❤️</div>
<div class="heart">💜</div>
<div class="heart">💗</div>
<div class="heart">💖</div>
<div class="heart">❤️</div>

<!-- ✨ Glowing Particles -->
<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

</body>
</html>
